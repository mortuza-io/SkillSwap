{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SkillSwap{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <a class="brand" href="{% url 'home' %}">SkillSwap<span>Learn together. Grow together.</span></a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">Log out</button></form>
        {% else %}
        <a href="{% url 'login' %}">Log in</a>
        {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
