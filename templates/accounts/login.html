{% extends 'base.html' %}
{% block title %}Log in · SkillSwap{% endblock %}
{% block content %}
<section class="card">
    <span class="eyebrow">YOUR LEARNING COMMUNITY</span>
    <h1>Welcome back</h1>
    <p class="intro">Log in to continue your learning journey.</p>
    <form method="post">
        {% csrf_token %}
        {% include 'accounts/form_fields.html' %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="primary" type="submit">Log in</button>
    </form>
    <p class="footer-text">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
