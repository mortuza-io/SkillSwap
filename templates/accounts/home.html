{% extends 'base.html' %}
{% block title %}Your account · SkillSwap{% endblock %}
{% block content %}
<section class="card">
    <span class="eyebrow">YOU'RE SIGNED IN</span>
    <h1>Hello, {{ user.full_name|default:user.username }}.</h1>
    <p class="intro">Welcome to your SkillSwap account.</p>
    <dl><dt>Username</dt><dd>{{ user.username }}</dd><dt>Email</dt><dd>{{ user.email }}</dd></dl>
</section>
{% endblock %}
